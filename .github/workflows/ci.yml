name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build
        run: ./build.ps1
      - name: Test with synthetic data
        run: |
          & ./bin/CodexRelay.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
